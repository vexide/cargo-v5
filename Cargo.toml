[package]
name = "cargo-v5"
version = "0.12.1"
edition = "2024"
authors = [
    "vexide",
    "Gavin Niederman <gavinniederman@gmail.com>",
    "doinkythederp <doinkythederp@icloud.com>",
    "Tropical",
]
license = "MIT"
description = "Cargo tool for working with VEX V5 Rust projects"
homepage = "https://vexide.dev"
repository = "https://github.com/vexide/cargo-v5"
rust-version = "1.88" # let chains

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
cargo-subcommand-metadata = "0.1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
smol = "2.0.2"
clap = { version = "4.5.40", features = ["derive"] }
inquire = { version = "0.7.5", default-features = false, features = [
    "crossterm",
] }
indicatif = "0.18.0"
vex-v5-serial = { git = "https://github.com/vexide/vex-v5-serial.git", default-features = false, features = [
    "serial",
    "file-commands",
    "screen-commands",
] }
miette = { version = "7.6.0", features = ["fancy-no-backtrace"] }
object = { version = "0.37.1", default-features = false, features = [
    "std",
    "read_core",
    "elf",
] }
bidiff = "1.0.0"
futures-util = "0.3"
ctrlc = "3.5.2"
async-channel = "2.5.0"
flate2 = "1.1.2"
tar = "0.4.44"
flexi_logger = "0.31.4"
log = "0.4.28"
humansize = "2.1.3"
tabwriter = { version = "1.4.1", features = ["ansi_formatting"] }
chrono = { version = "0.4", default-features = false }
image = { version = "0.25.8", default-features = false, features = ["png"] }

axoupdater = { version = "0.9.0", default-features = false, optional = true, features = [
    "github_releases",
] }
ratatui = { version = "0.29.0", optional = true }
crossterm = { version = "0.29.0", optional = true }
tui-term = { version = "0.2.0", optional = true }
directories = { version = "6.0.0", optional = true }
ureq = { version = "3.4.2", features = ["json"], optional = true }

[features]
default = ["fetch-template"]

shellscript = ["dep:axoupdater"]
field-control = ["dep:ratatui", "dep:crossterm", "dep:tui-term"]
fetch-template = ["dep:ureq", "dep:directories"]

[[bin]]
name = "cargo-v5"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
